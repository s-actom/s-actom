# Registo das equipas (Fase 0). Editado à mão; o gerador só lê.
# Formato: subconjunto de YAML lido por gerador/yamlmini.py (falha fechada).
# Fonte das regras: distribuir_equipas.py e classify.py da auditoria de 2026-11-05,
# agency-commander/divisions.yaml e desenho-direcao-geral.md (secções 6, 7 e 9).
# Slugs iguais aos ids de ~/.codex/jev-router/config/teams.yaml (reutilização no adaptador do JEV).
# Ordem de decisão de cada item: 1) excecoes  2) prefixos  3) Direção Geral  4) sufixos de qualidade
#                                5) Harness (Base ou Sistema)  6) Dados  7) funcoes  8) sem equipa.
# excecoes: ids do snapshot de 2026-11-05 (têm de existir). excecoes_novas: decisões posteriores ao snapshot
# (itens que só o disco de agora tem); podem não existir e não falham a verificação.
# excluidos (fim do ficheiro): depois da verificação do desenho, saem de todas as listas publicadas.
versao: 1
desenho: "desenho-direcao-geral.md (aprovado pelo dono em 2026-11-07)"
instantaneo: "entradas/auditoria-itens-2026-11-05.json"

