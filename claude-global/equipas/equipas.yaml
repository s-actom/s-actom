  qualidade_para: "qualidade"
  qualidade_funcoes: ["Linguagens e frameworks", "Backend, APIs, dados e arquitetura", "Frontend e animação web"]
  qualidade_sufixos: ["-reviewer", "-review", "-testing", "-test"]
  base:
    origens: ["App (embutido)"]
    prefixos: ["artifact-", "anthropic-skills:artifact-", "caveman:", "ponytail:", "i-have-adhd:"]
