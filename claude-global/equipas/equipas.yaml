    nome: "Direção Geral"
    esperado_itens: 175
    descricao: "Recebe pedidos e escolhe equipas. Traz as formas de trabalhar (175). Método: superpowers."
    funcoes: ["Workflow e orquestração"]
    prefixos: ["gsd-"]

