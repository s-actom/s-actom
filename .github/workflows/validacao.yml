name: validacao-claude-global

on:
  pull_request:
  push:
    branches: ["main", "claude-global/**"]
  workflow_dispatch:

jobs:
  validar:
    name: Validar claude-global
    # macOS: ambiente-alvo do sistema (paths darwin, `script`/pty, stat -f).
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Passos condicionais: a série de importação divide o snapshot em PRs
      # disjuntos; cada passo só corre se os seus ficheiros estiverem presentes.

      - name: Validações (JSON, YAML, frontmatter, segredos, higiene)
        if: hashFiles('claude-global/settings.json') != ''
        run: bash claude-global/validar.sh

      - name: Testes — hooks da Direção Geral (node)
        if: hashFiles('claude-global/equipas/hooks/tests/hooks.test.mjs') != ''
        run: cd claude-global/equipas/hooks && node --test tests/hooks.test.mjs tests/fase2.test.mjs tests/recurso.test.mjs

      - name: Testes — contrato do modo do JEV (node)
        if: hashFiles('claude-global/equipas/hooks/tests/portao-modo.test.mjs') != ''
        run: cd claude-global/equipas/hooks && node --test tests/portao-modo.test.mjs

      - name: Testes — context-handoff (node)
        if: hashFiles('claude-global/hooks/context-handoff.test.js') != ''
        run: cd claude-global && node --test hooks/context-handoff.test.js

      - name: Testes — hook Claude Security (node)
        if: hashFiles('claude-global/hooks/claude-security-stop-hook.test.mjs') != ''
        run: cd claude-global && node --test hooks/claude-security-stop-hook.test.mjs

      - name: Testes — gerador de equipas (python)
        if: hashFiles('claude-global/equipas/gerador/tests/test_gerar.py') != ''
        run: cd claude-global/equipas/gerador && PYTHONPATH=. python3 -m unittest discover -s tests

      - name: Testes — guardas da Direção Geral (bash)
        if: hashFiles('claude-global/equipas/hooks/tests/test-guarda-equipa.sh') != ''
        run: |
          cd claude-global/equipas/hooks/tests
          bash test-guarda-equipa.sh
          bash test-guarda-sessao.sh
          bash test-rede-vibesec.sh

      - name: Testes — integridade do rollback (bash)
        if: hashFiles('claude-global/equipas/reverter/testes/test-reverter-integridade.sh') != ''
        run: bash claude-global/equipas/reverter/testes/test-reverter-integridade.sh

      - name: Guarda dos patches a agentes de terceiros (bash)
        if: hashFiles('claude-global/agents/security/blockchain-security-auditor.md') != ''
          || hashFiles('claude-global/agents/security/penetration-tester.md') != ''
          || hashFiles('claude-global/agents/engineering/incident-response-commander.md') != ''
          || hashFiles('claude-global/agents/engineering/multi-agent-systems-architect.md') != ''
        run: bash claude-global/testes-agentes.sh

      - name: Instalação e recuperação numa instalação isolada (bash)
        if: hashFiles('claude-global/instalar.sh') != ''
        run: bash claude-global/teste-instalacao.sh

      - name: Testes — aplicador limitado ao manifesto (bash)
        if: hashFiles('claude-global/teste-aplicar.sh') != ''
        run: bash claude-global/teste-aplicar.sh

      - name: Testes — validar.sh (bash)
        if: hashFiles('claude-global/validar.test.sh') != ''
        run: bash claude-global/validar.test.sh

      - name: Testes — wrapper CodeRabbit (bash)
        if: hashFiles('claude-global/scripts/coderabbit-review.test.sh') != ''
        run: bash claude-global/scripts/coderabbit-review.test.sh

      # NÃO correm aqui (documentado em claude-global/docs/VALIDACAO.md):
      #   test-integracao.sh, teste-ab.sh, teste-c-jev.sh — exigem `claude -p` real
      #   (custo por execução), HOME autenticado e/ou sandbox-exec do macOS.
      #   test-fase-1.sh e test-ligar-guarda-sessao.sh — constroem um HOME a partir
      #   do ~/.claude real da máquina (não existe num runner limpo).

  gitleaks:
    name: Análise de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
